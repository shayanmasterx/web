<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice3</title>
</head>
<body>
    <!-- خب ما تگ زیر رو برای این مینویسیم که بخشی از متون رو بولد یا قوی کنیم که ضخیم دیده بشه -->
     <!-- <b> -->
        <!-- خب و تگ زیر برای این که متن ما ایتالیک یا کج بشه که میتونیم تو تگ بنویسیم یا تگ جدا برایش در نظر بگیریم -->
    <p><b> <i>welcome</i></b> to my web</p>
    <i>yo yo</i>

    <P><i><b>and this is my 3 class</b></i> </P>
    <!-- و تگ بعدی متن رو کوچیک میکنه -->
     <!-- small -->
     <p><b> <i>welcome</i></b> <small>to my web</small></p>
     <!-- تگ بعدی متن رو هایلایت میکنه -->
      <!-- mark -->
       <cite><mark>im shayan</mark></cite>
       <p><b> <i>welcome</i></b> <mark>to my web</mark></p>
       <!-- خب تگ زیر کاری میکنه که متن خط بخوره -->
        <!-- del -->
        <p><b> <i>welcome</i></b> <del><small>to my web</small></del></p>
        <!-- تگ زیر به جای این که روی متن  خط بکشه زیر متن خط میکشه -->
         <!-- ins -->
         <p><b> <i>welcome</i></b> <ins><small>to my web</small></ins></p>
         <!-- تگ زیر برای ما یه حالت نقل قول به وجود میاره -->
          <!-- q -->
          <p><b> <i>welcome</i></b> <q> to my web </q></p>
          <P><i><b><abbr title="poyot academy">and this is my 3 class</abbr></b></i> </P>
          <!-- برای اتریبیوت های زیر هیچ توضیحی به زهنم نمیرسه -->
          <p>this is my web &copy; </p>
          <p>this is my web &euro; </p>
          <p>this is my web &dollar; </p>
</body>
</html>
