<body>
    <!-- برای این که بین کلمه هامون فاصله بدیم بایداین کد رو در بین تگ بنویسیم -->
     <!-- &nbsp; -->
   <cite>and welcome &nbsp;  to the peactice 2</cite>
   <br>
   <!-- برای این که کلمه تو دو خط نوشته بشه از تگ پایین استفاده میکنیم --> 
    <!-- br -->
   <strong>and this is <br> my web</strong><strong>
    <!-- ولی میتونیم از تگ دیگری استفاده کنیم که فاصله پیدا کنید به اسم -->
     <!-- <pre> -->
        <pre>hi im       shayan   master  x</pre>
        <!-- حتی در این تگ لازم نیست بی ار بنویسیم  -->
         <pre>hi im shayan
             masterx</pre>
        <!-- ولی بهتره از تگ پی استفاده کنیم که سعو بیشتری دارد -->
         <!-- برای این که سعو بیشتری داشته باشیم و تیتر داشته باشی از تنگ پاییین استفاده میکنیم -->
          <!-- h1 تا h6 -->
           <h1>im shayan masterx</h1>

</body>
