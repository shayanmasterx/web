<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice4</title>
<body>
    <!-- ما یک اتریبیوت برای تگمون در نظر گرفتیم و فونت متن رو عوض کردیم -->
         <p style="font-family:Georgia, 'Times New Roman', Times, serif ;">masterx</p>
         <p style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">shayan masterx</p>
         <!-- خب ما اینجا یه اتریبیوت دیگه ای داریم که میتونیم انتخاب کنیم متن کدوم طرفی باشد -->
          <p  style="color: red;"  align="center">copy right &copy;</p>
          <p  style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"  align="right">shayan</p>
          <!-- و ما میتونیم اینجا سایز فونت رو هم انتخاب کنیم -->
           <p style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: larger;">shayan abassi</p>
</body>
</html>
